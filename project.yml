name: DuoWorkspace
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '0.6.0'
    CURRENT_PROJECT_VERSION: '21'
packages:
  DuoWorkspace:
    path: .
targets:
  DuoWorkspace:
    type: application
    platform: iOS
    sources: [Apps/iOS]
    dependencies:
      - package: DuoWorkspace
        product: DuoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.duoworkspace.client
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Duo Workspace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Connect to your paired Mac to show its screen and send your input.
        NSMicrophoneUsageDescription: Send your microphone audio to your paired Mac when you turn on Duo Microphone.
        NSBonjourServices: [_duoworkspace._tcp]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  DuoClientTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/DuoClientTests]
    dependencies:
      - target: DuoWorkspace
      - package: DuoWorkspace
        product: DuoCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DuoWorkspaceHost:
    type: application
    platform: macOS
    sources: [Apps/macOS]
    dependencies:
      - package: DuoWorkspace
        product: DuoHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.duoworkspace.host
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/DuoWorkspaceHost.entitlements
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGNING_ALLOWED: NO
        DUO_LOCAL_SIGNING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    preBuildScripts:
      - name: Prepare local host signing
        script: '"$SRCROOT/Scripts/xcode-local-signing.sh" prepare'
        showEnvVars: false
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Build microphone installer
        script: '"$SRCROOT/Scripts/build-microphone-driver.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"'
        showEnvVars: false
        basedOnDependencyAnalysis: false
      - name: Sign local host
        script: '"$SRCROOT/Scripts/xcode-local-signing.sh" sign'
        showEnvVars: false
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: Duo Workspace Host
        NSIsTouchNative: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Share your screen with a device you pair.
        NSBonjourServices: [_duoworkspace._tcp]
schemes:
  DuoWorkspace:
    build:
      targets:
        DuoWorkspace: all
    test:
      targets: [DuoClientTests]
  DuoWorkspaceHost:
    build:
      targets:
        DuoWorkspaceHost: all
